    <script>
      (function(){
        const content = '📅 Pour information, le terme officiel est prévu le 25/06.';
        function addOfficialTermNote(){
          const copy = document.querySelector('.hero-copy');
          if (!copy || document.querySelector('.official-term-note')) return false;
          const note = document.createElement('p');
          note.className = 'official-term-note';
          note.textContent = content;
          copy.insertAdjacentElement('afterend', note);
          return true;
        }
        const timer = setInterval(function(){ if (addOfficialTermNote()) clearInterval(timer); }, 150);
        setTimeout(function(){ clearInterval(timer); addOfficialTermNote(); }, 5000);
      })();
    </script>
