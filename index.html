<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLPI Baby Bet Marine</title>
    <style>
      :root{
        --glpi-blue:#1f5d8f;
        --glpi-blue-dark:#17466d;
        --glpi-cyan:#2b9dcc;
        --glpi-bg:#eef2f5;
        --glpi-panel:#ffffff;
        --glpi-border:#cfd8df;
        --glpi-text:#263238;
        --glpi-muted:#6b7c88;
        --glpi-green:#4caf50;
        --glpi-orange:#f39c12;
        --glpi-red:#d9534f;
        --glpi-purple:#7952b3;
      }

      *{box-sizing:border-box}
      body{background:var(--glpi-bg)!important;color:var(--glpi-text)!important;font-family:Arial,Helvetica,sans-serif!important}

      .glpi-topbar{position:sticky;top:0;z-index:80;height:46px;background:linear-gradient(#2f6f9f,#1d557f);border-bottom:1px solid #123c5a;color:#fff;display:flex;align-items:center;padding:0 14px;box-shadow:0 2px 5px rgba(0,0,0,.18)}
      .glpi-brand{font-weight:700;font-size:20px;letter-spacing:-.04em;margin-right:18px}.glpi-brand span{font-weight:400;color:#b9e5ff}.glpi-tabs{display:flex;gap:2px;height:100%;align-items:end}.glpi-tabs a{color:#e8f5fc;text-decoration:none;font-size:13px;padding:13px 13px 12px;border-radius:6px 6px 0 0}.glpi-tabs a.active,.glpi-tabs a:hover{background:rgba(255,255,255,.16)}.glpi-user{margin-left:auto;font-size:12px;color:#d8edf8;display:flex;gap:12px;align-items:center}.glpi-user b{color:#fff}
      .glpi-sidebar{position:fixed;left:0;top:46px;bottom:0;width:208px;background:#24313b;color:#d4dde3;border-right:1px solid #17242c;z-index:70;padding:12px 10px;overflow:auto}.glpi-side-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8fa2b0;margin:8px 8px}.glpi-side-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;color:#e7edf1;font-size:13px;margin:2px 0}.glpi-side-item.active{background:#1f5d8f;color:#fff}.glpi-side-item:hover{background:#344653}.glpi-breadcrumb{position:relative;margin-left:208px;background:#fff;border-bottom:1px solid var(--glpi-border);padding:8px 18px;color:#60727f;font-size:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}

      .app-shell{padding:14px 18px 24px 226px!important;background:var(--glpi-bg)!important;min-height:calc(100vh - 46px)!important}.app-grid{max-width:1600px!important;margin:0!important;display:grid!important;grid-template-columns:1.15fr .85fr!important;gap:12px!important;align-items:start!important}.aurora{display:none!important}

      .hero-panel,.info-panel,.participation-zone,.side-quests-panel,.tickets-panel,.message-wall-panel,.admin-panel,.consensus-strip,.data-lab-panel{background:var(--glpi-panel)!important;border:1px solid var(--glpi-border)!important;border-radius:3px!important;box-shadow:0 1px 2px rgba(0,0,0,.08)!important;backdrop-filter:none!important;color:var(--glpi-text)!important;padding:12px!important;overflow:hidden!important}.hero-panel{grid-column:1/-1!important;min-height:134px!important;align-content:start!important;background:#fff!important;position:relative!important}.hero-panel:after{content:'Ticket #2026-NAISS-MARINE'!important;right:16px!important;top:14px!important;font-size:22px!important;color:#d9e1e7!important;letter-spacing:0!important;font-weight:700!important}.hero-panel:before{content:'Assistance > Tickets > Naissance Marine';display:block;background:#f6f8fa;border-bottom:1px solid var(--glpi-border);margin:-12px -12px 12px;padding:8px 12px;color:#5d6f7b;font-size:12px}.brand-pill{background:#e8f2fa!important;border:1px solid #b9d7ea!important;color:#1f5d8f!important;border-radius:3px!important;font-size:12px!important;padding:5px 8px!important;font-weight:700!important}.hero-panel h1{font-size:30px!important;line-height:1.1!important;letter-spacing:-.03em!important;margin:8px 0 0!important;color:#263238!important}.hero-copy{font-size:14px!important;color:#53656f!important;margin-top:8px!important;max-width:760px!important}.hero-actions{margin-top:12px!important}.cta-primary,.participation-launch{background:linear-gradient(#2b8fc0,#1f6f99)!important;color:#fff!important;border:1px solid #155b80!important;border-radius:3px!important;box-shadow:none!important}.cta-secondary{background:#f7f9fb!important;color:#1f5d8f!important;border:1px solid #b7ccd9!important;border-radius:3px!important}.cta-primary.huge{font-size:13px!important;padding:9px 12px!important}

      .consensus-strip{grid-column:1/-1!important;display:grid!important;grid-template-columns:1.4fr repeat(5,1fr)!important;gap:8px!important;background:#f9fbfc!important}.strip-title{gap:8px!important}.strip-title>span,.panel-title>span{background:#e6eef4!important;color:#1f5d8f!important;border:1px solid #c8d8e4!important;border-radius:3px!important;width:32px!important;height:32px!important;font-size:17px!important}.strip-title b,.panel-title h2{color:#263238!important;font-size:16px!important;letter-spacing:0!important}.strip-title small,.panel-title p{color:#6b7c88!important;font-size:12px!important}.metric{background:#fff!important;border:1px solid #d7e0e6!important;border-radius:3px!important;padding:8px!important}.metric span{color:#60727f!important;font-size:10px!important}.metric strong{color:#263238!important;font-size:17px!important}.metric small{display:block;color:#78909c;font-size:11px;margin-top:3px}

      .info-panel{grid-column:1/2!important}.participation-zone{grid-column:2/3!important;display:grid!important;grid-template-columns:1fr!important;gap:10px!important}.info-cards{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.info-card{background:#f8fafb!important;border:1px solid #d9e2e8!important;border-radius:3px!important;padding:10px!important}.info-card>span{font-size:20px!important}.info-card b{color:#263238!important;font-size:13px!important;margin-top:6px!important}.info-card p,.participation-copy p{font-size:12px!important;color:#60727f!important;line-height:1.35!important}.participation-launch{min-height:54px!important;display:flex!important;justify-content:space-between!important;text-align:left!important;padding:10px 12px!important}.participation-launch b{font-size:18px!important}.participation-launch span{color:#d8edf8!important;font-size:12px!important}

      .side-quests-panel{grid-column:1/2!important}.message-wall-panel{grid-column:2/3!important}.quest-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.quest-card,.message-card{background:#fff!important;border:1px solid #d6e0e6!important;border-left:4px solid var(--glpi-blue)!important;border-radius:3px!important;padding:8px 10px!important;min-height:72px!important}.quest-card:nth-child(3n){border-left-color:var(--glpi-orange)!important}.quest-card:nth-child(4n){border-left-color:var(--glpi-green)!important}.quest-card span{color:#60727f!important;font-size:10px!important}.quest-card b{color:#263238!important;font-size:16px!important;letter-spacing:0!important}.quest-card p,.message-card p{font-size:12px!important;color:#60727f!important;line-height:1.28!important}.message-wall{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;max-height:330px!important;overflow:auto!important}.message-card b{color:#1f5d8f!important}.empty-state{background:#fff!important;border:1px dashed #b9c8d2!important;border-radius:3px!important;color:#78909c!important}

      .tickets-panel{grid-column:1/-1!important}.tickets-wall{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important}.ticket{position:relative;background:#fff!important;border:1px solid #ccd8df!important;border-left:5px solid var(--glpi-blue)!important;border-radius:3px!important;box-shadow:0 1px 2px rgba(0,0,0,.06)!important;color:#263238!important;text-align:left!important;padding:10px!important}.ticket:nth-child(2n){border-left-color:var(--glpi-orange)!important}.ticket:nth-child(3n){border-left-color:var(--glpi-green)!important}.ticket:before{content:'Incident';position:absolute;right:8px;top:8px;background:#eef5fa;border:1px solid #c5d8e6;color:#1f5d8f;font-size:10px;font-weight:700;padding:3px 6px;border-radius:3px}.ticket-top{gap:8px!important}.ticket-top span{width:30px!important;height:30px!important;border-radius:3px!important;background:#1f5d8f!important;color:#fff!important}.ticket-top b{font-size:15px!important;color:#263238!important;padding-right:66px}.ticket-prediction{font-size:13px!important;color:#40545f!important;margin-top:8px!important}.ticket-meta{gap:5px!important;margin-top:8px!important}.ticket-meta span{background:#eef3f6!important;color:#40545f!important;border:1px solid #d2dfe7!important;border-radius:3px!important;padding:4px 6px!important;font-size:11px!important}.ticket-badges{border-top:1px solid #e0e7ec!important}.ticket-badges span{background:#f5f7f9!important;color:#40545f!important;border:1px solid #d6e0e6!important;box-shadow:none!important}.ticket-badges .auto-first-badge{background:#fff4cc!important;border-color:#f0ca51!important;color:#5f4800!important}.ticket-badges .auto-last-badge{background:#e8f4ff!important;color:#1f5d8f!important}

      .data-lab-panel{grid-column:1/-1!important;background:#fff!important}.data-lab-panel .panel-title:after{content:'Graphiques générés depuis la table public.bets';margin-left:auto;color:#78909c;font-size:11px}.data-lab-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px!important}.chart-card{background:#f8fafb!important;border:1px solid #d7e1e8!important;border-radius:3px!important;box-shadow:none!important;min-height:190px!important;padding:10px!important}.chart-head b{color:#263238!important;font-size:14px!important}.chart-head span{color:#78909c!important;font-size:11px!important}.donut:after{background:#f8fafb!important}.donut b{color:#263238!important}.histo-row span,.date-bar b,.date-bar small,.legend-row,.scatter text{color:#40545f!important;fill:#40545f!important}.bar-track,.histo-row div{background:#dfe8ee!important}.empty-mini{background:#fff!important;color:#78909c!important;border-color:#cbd8e0!important;border-radius:3px!important}

      .admin-panel{grid-column:1/-1!important;background:#fff!important;border-top:4px solid #263238!important}.admin-login{display:flex!important;gap:8px!important}.result-fields{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:8px!important}.admin-actions button,.admin-login button{background:#1f5d8f!important;color:#fff!important;border:1px solid #17466d!important;border-radius:3px!important}.locked{background:#f8fafb!important;border:1px dashed #b9c8d2!important;border-radius:3px!important;color:#60727f!important}.podium-card{border-radius:3px!important;background:#f8fafb!important;border:1px solid #d7e1e8!important;color:#263238!important}.podium-card strong,.podium-card b{color:#263238!important}

      input,select,textarea{border:1px solid #b7c7d1!important;border-radius:3px!important;background:#fff!important;color:#263238!important;padding:8px 9px!important}.choice{border-radius:3px!important;background:#f8fafb!important;color:#263238!important;border:1px solid #cbd8e0!important}.choice.active{background:#1f5d8f!important;color:#fff!important}.progress-steps button{border-radius:3px!important}.progress-steps button.active{background:#1f5d8f!important;color:#fff!important}.wizard-card,.modal-card,.participation-modal{border-radius:3px!important;background:#fff!important;color:#263238!important;border:1px solid #cbd8e0!important}.participation-backdrop,.modal-backdrop{background:rgba(38,50,56,.7)!important}.participation-aside{background:#f2f6f9!important;border-right:1px solid #cbd8e0!important}.participation-aside h2,.modal-card h2{color:#263238!important}.participation-aside p,.modal-card p{color:#60727f!important}.gift-card{background:#fff!important;border:1px solid #d7e1e8!important;border-radius:3px!important}.modal-close{background:#e5edf2!important;color:#263238!important}.ticket-big-avatar{border-radius:3px!important;background:#1f5d8f!important;color:#fff!important}.danger{border-radius:3px!important;background:#d9534f!important}.toast{border-radius:3px!important;background:#263238!important;color:#fff!important}

      .glpi-status-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px 0}.glpi-kpi{background:#fff;border:1px solid var(--glpi-border);border-left:4px solid var(--glpi-blue);padding:9px}.glpi-kpi span{display:block;color:#60727f;font-size:10px;text-transform:uppercase;font-weight:700}.glpi-kpi b{display:block;color:#263238;font-size:18px;margin-top:3px}.glpi-kpi:nth-child(2){border-left-color:var(--glpi-orange)}.glpi-kpi:nth-child(3){border-left-color:var(--glpi-green)}.glpi-kpi:nth-child(4){border-left-color:var(--glpi-purple)}.glpi-kpi:nth-child(5){border-left-color:var(--glpi-red)}

      @media(max-width:1050px){.glpi-sidebar{display:none}.glpi-breadcrumb{margin-left:0}.app-shell{padding:12px!important}.app-grid{grid-template-columns:1fr!important}.info-panel,.participation-zone,.side-quests-panel,.message-wall-panel,.tickets-panel,.admin-panel,.data-lab-panel{grid-column:1/-1!important}.tickets-wall,.data-lab-grid{grid-template-columns:repeat(2,1fr)!important}.glpi-tabs{display:none}.glpi-status-row{grid-template-columns:repeat(2,1fr)}}
      @media(max-width:680px){.tickets-wall,.data-lab-grid,.quest-grid,.result-fields,.glpi-status-row{grid-template-columns:1fr!important}.glpi-user{display:none}.hero-panel h1{font-size:24px!important}}
    </style>
  </head>
  <body>
    <div class="glpi-topbar">
      <div class="glpi-brand">GLPI <span>Baby Bet</span></div>
      <nav class="glpi-tabs"><a class="active">Parc</a><a>Assistance</a><a>Gestion</a><a>Outils</a><a>Administration</a><a>Configuration</a></nav>
      <div class="glpi-user">Root entity &gt; AP-HM <b>Jean V</b></div>
    </div>
    <aside class="glpi-sidebar">
      <div class="glpi-side-title">Assistance</div>
      <div class="glpi-side-item active">🎟️ Tickets naissance</div>
      <div class="glpi-side-item">📊 Tableau de bord</div>
      <div class="glpi-side-item">🏅 Badges collectifs</div>
      <div class="glpi-side-item">💌 Messages</div>
      <div class="glpi-side-title">Administration</div>
      <div class="glpi-side-item">🔐 Résultat final</div>
      <div class="glpi-side-item">🧾 Export</div>
      <div class="glpi-side-item">⚙️ Paramètres</div>
    </aside>
    <div class="glpi-breadcrumb">Accueil &gt; Assistance &gt; Tickets &gt; Baby Bet Marine &gt; Suivi pronostics</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        function insertStatus(){
          const hero=document.querySelector('.hero-panel');
          if(!hero||document.querySelector('.glpi-status-row'))return;
          const tickets=document.querySelectorAll('.ticket').length;
          const messages=document.querySelectorAll('.message-card').length;
          const row=document.createElement('div');
          row.className='glpi-status-row';
          row.innerHTML='<div class="glpi-kpi"><span>Statut</span><b>En cours</b></div><div class="glpi-kpi"><span>Priorité</span><b>Festive</b></div><div class="glpi-kpi"><span>Tickets</span><b>'+tickets+'</b></div><div class="glpi-kpi"><span>Messages</span><b>'+messages+'</b></div><div class="glpi-kpi"><span>Échéance</span><b>25/06</b></div>';
          hero.appendChild(row);
        }
        const t=setInterval(()=>{insertStatus(); if(document.querySelector('.tickets-panel')) clearInterval(t);},250);
        setInterval(insertStatus,5000);
      })();
    </script>
  </body>
</html>
