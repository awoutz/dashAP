        const card=(t,s,b)=>'<article class="chart-card"><div class="chart-head"><b>'+t+'</b><span>'+s+'</span></div>'+b+'</article>';
        function status(){const hero=document.querySelector('.hero-panel');if(!hero)return;document.querySelector('.glpi-status-row')?.remove();const tickets=document.querySelectorAll('.ticket').length;const messages=document.querySelectorAll('.message-card').length;const row=document.createElement('div');row.className='glpi-status-row';row.innerHTML='<div class="glpi-kpi"><span>Status</span><b>New</b></div><div class="glpi-kpi"><span>Priority</span><b>High</b></div><div class="glpi-kpi"><span>Tickets</span><b>'+tickets+'</b></div><div class="glpi-kpi"><span>Messages</span><b>'+messages+'</b></div><div class="glpi-kpi"><span>Due date</span><b>25/06</b></div>';hero.appendChild(row)}
        function renderDataLab(bets){document.querySelector('.data-lab-panel')?.remove();const total=Math.max(1,bets.length);const sex=countBy(bets.map(b=>b.sex));const girl=sex.find(x=>x.label==='Fille')?.count||0,boy=sex.find(x=>x.label==='Garçon')?.count||0,surprise=Math.max(0,bets.length-girl-boy);const gp=pct(girl,total),bp=pct(boy,total);const dates=range().map(date=>({date,count:bets.filter(b=>b.birth_date===date).length}));const maxDate=Math.max(1,...dates.map(d=>d.count));const weights=countBy(bets.map(b=>bucket(b.weight)).filter(Boolean));const maxWeight=Math.max(1,...weights.map(w=>w.count));const names=countBy(bets.map(b=>b.first_name).filter(Boolean)).slice(0,10);const maxName=Math.max(1,...names.map(n=>n.count));const points=bets.map(b=>({player:b.player,weight:grams(b.weight),height:Number(b.height),note:b.note})).filter(p=>Number.isFinite(p.weight)&&Number.isFinite(p.height));const minW=Math.min(2600,...points.map(p=>p.weight)),maxW=Math.max(4300,...points.map(p=>p.weight)),minH=Math.min(45,...points.map(p=>p.height)),maxH=Math.max(55,...points.map(p=>p.height));const donut=card('Répartition sexe','Donut compact','<div class="donut-wrap"><div class="donut" style="background:conic-gradient(#fb7185 0 '+gp+'%, #60a5fa '+gp+'% '+(gp+bp)+'%, #facc15 '+(gp+bp)+'% 100%)"><b>'+(sex[0]?.label||'—')+'</b><span>majoritaire</span></div><div class="legend"><div class="legend-row pink"><i></i><span>Fille</span><b>'+girl+'</b></div><div class="legend-row blue"><i></i><span>Garçon</span><b>'+boy+'</b></div><div class="legend-row gold"><i></i><span>Surprise</span><b>'+surprise+'</b></div></div></div>');const dateBars=card('Heatmap dates','Jours les plus joués','<div class="date-bars">'+dates.map(d=>'<div class="date-bar"><div class="bar-track"><span style="height:'+(10+d.count/maxDate*90)+'%"></span></div><b>'+fmt(d.date)+'</b><small>'+d.count+'</small></div>').join('')+'</div>');const histo=card('Histogramme poids','Tranches kg','<div class="histo">'+(weights.length?weights.map(w=>'<div class="histo-row"><span>'+w.label+'</span><div><i style="width:'+(w.count/maxWeight*100)+'%"></i></div><b>'+w.count+'</b></div>').join(''):'<div class="empty-mini">Pas assez de données.</div>')+'</div>');const cloud=card('Nuage prénoms','Fréquence','<div class="name-cloud">'+(names.length?names.map(n=>'<span style="--power:'+(0.75+n.count/maxName*.55)+'">'+n.label+'<b>'+n.count+'</b></span>').join(''):'<div class="empty-mini">Pas encore de prénoms.</div>')+'</div>');const scatter=card('Poids × taille','Scatterplot',points.length?'<svg class="scatter" viewBox="0 0 360 155"><line x1="34" y1="128" x2="336" y2="128"></line><line x1="34" y1="18" x2="34" y2="128"></line><line class="gridline" x1="34" x2="336" y1="54" y2="54"></line><line class="gridline" x1="34" x2="336" y1="91" y2="91"></line>'+points.map((p,i)=>{const x=42+((p.weight-minW)/Math.max(1,maxW-minW))*286;const y=122-((p.height-minH)/Math.max(1,maxH-minH))*100;return '<g><circle cx="'+x+'" cy="'+y+'" r="'+(p.note?7:5)+'" class="point '+(i%2?'alt':'')+'"><title>'+p.player+'</title></circle><text x="'+(x+8)+'" y="'+(y+4)+'">'+String(p.player||'?').slice(0,2).toUpperCase()+'</text></g>'}).join('')+'<text class="axis-label" x="260" y="150">poids</text><text class="axis-label" x="4" y="24">taille</text></svg>':'<div class="empty-mini">Pas assez de données.</div>');const panel=document.createElement('section');panel.className='data-lab-panel';panel.innerHTML='<div class="panel-title"><span>📊</span><div><h2>Data Lab</h2><p>Mode analyste GLPI : lecture visuelle des pronostics.</p></div></div><div class="data-lab-grid">'+donut+dateBars+histo+cloud+scatter+'</div>';const admin=document.querySelector('.admin-panel');if(admin)admin.parentNode.insertBefore(panel,admin)}
        async function load(){try{status();const r=await fetch(URL+'/rest/v1/bets?select=*&order=created_at.asc',{headers:{apikey:KEY,authorization:'Bearer '+KEY}});const bets=await r.json();renderDataLab(Array.isArray(bets)?bets:[])}catch(e){console.warn(e)}}
        const t=setInterval(()=>{if(document.querySelector('.tickets-panel')&&document.querySelector('.admin-panel')){clearInterval(t);load()}},250);setInterval(load,20000);
      })();
    </script>
  </body>
</html>
