<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLPI Baby Bet Marine</title>
    <style>
      :root{
        --g-sidebar:#263b5f;
        --g-sidebar-2:#20334f;
        --g-sidebar-active:#213451;
        --g-yellow:#ffc84d;
        --g-bg:#f3f5f8;
        --g-panel:#ffffff;
        --g-line:#dfe5ec;
        --g-soft:#f8fafc;
        --g-text:#2d3748;
        --g-muted:#7a8796;
        --g-blue:#3f6f9f;
        --g-green:#58b368;
        --g-red:#dc5b5b;
        --g-orange:#f5a623;
      }
      *{box-sizing:border-box}html,body,#root{min-height:100%}body{margin:0!important;background:var(--g-bg)!important;color:var(--g-text)!important;font-family:Inter,Arial,Helvetica,sans-serif!important;font-size:13px!important}.aurora{display:none!important}

      .glpi-shell{display:block}.glpi-sidebar{position:fixed;z-index:100;left:0;top:0;bottom:0;width:236px;background:var(--g-sidebar);color:#d9e2ef;box-shadow:2px 0 8px rgba(15,23,42,.18);overflow:auto}.glpi-logo{height:74px;display:flex;align-items:center;justify-content:center;font-size:36px;font-style:italic;font-weight:800;letter-spacing:-.1em;color:#fff}.glpi-logo span{letter-spacing:-.08em}.glpi-goto{height:30px;margin:0 22px 16px;border:1px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;background:rgba(15,23,42,.15)}.glpi-menu-section{margin:10px 0 2px;padding:8px 22px;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between}.glpi-menu-section.active{color:var(--g-yellow)}.glpi-menu-item{height:34px;display:flex;align-items:center;gap:10px;padding:0 22px 0 36px;color:#e5edf7;font-size:13px;text-decoration:none;border-left:4px solid transparent}.glpi-menu-item:hover{background:rgba(255,255,255,.05)}.glpi-menu-item.active{background:var(--g-sidebar-active);border-left-color:var(--g-yellow);color:#fff;font-weight:800}.glpi-menu-item .ico{width:14px;text-align:center;color:#fff}.glpi-collapse{position:absolute;left:22px;bottom:18px;font-size:12px;color:#e5edf7;font-weight:700}.glpi-topbar{position:fixed;z-index:90;top:0;left:236px;right:0;height:50px;background:#fff;border-bottom:1px solid var(--g-line);display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 3px rgba(15,23,42,.06)}.glpi-breadcrumb{display:flex;align-items:center;gap:8px;color:#657487;font-size:13px;white-space:nowrap}.glpi-breadcrumb b{color:#1f2937}.glpi-actions{display:flex;gap:4px;margin-left:16px}.glpi-actions button{height:28px;border:1px solid var(--g-line);background:#fff;color:#516174;font-weight:700;font-size:12px;padding:0 9px;border-radius:2px}.glpi-actions button.primary{background:#f9fbff}.glpi-search{margin-left:auto;display:flex;height:32px;border:1px solid var(--g-line);background:#fff}.glpi-search input{width:210px;border:0!important;outline:0;background:#fff!important;padding:0 10px!important;color:#667085!important}.glpi-search button{width:42px;border:0;border-left:1px solid var(--g-line);background:#fff;color:#53687c;font-size:16px}.glpi-user{display:flex;align-items:center;gap:10px;margin-left:18px;color:#344054;font-size:13px}.glpi-user small{display:block;color:#7a8796;font-size:11px}.glpi-avatar{width:34px;height:34px;border-radius:3px;background:linear-gradient(135deg,#d9e2ec,#fff);border:1px solid var(--g-line);display:grid;place-items:center}.glpi-filterbar{position:fixed;z-index:85;top:50px;left:236px;right:0;min-height:66px;background:#f3f6fa;border-bottom:1px solid #cbd5e1;padding:12px 18px 10px}.glpi-filter-row{display:flex;align-items:center;gap:6px}.glpi-filter-row select,.glpi-filter-row input{height:34px;border:1px solid #d4dce5!important;background:#fff!important;border-radius:2px!important;color:#334155!important;padding:0 10px!important}.glpi-filter-row button{height:30px;border:1px solid #d4dce5;background:#fff;border-radius:2px;color:#425466;font-weight:700;font-size:12px;padding:0 9px}.glpi-filter-row .search{background:var(--g-yellow);border-color:#e2aa1d;color:#263238}.glpi-rules{margin-top:9px;display:flex;gap:5px}.glpi-rules span{display:inline-flex;align-items:center;gap:4px;height:24px;border:1px solid #d4dce5;background:#fff;color:#425466;padding:0 8px;font-size:12px}.glpi-rules .star{border:0;background:transparent;color:#6b7c8f;font-size:18px}

      .app-shell{padding:132px 18px 24px 254px!important;background:var(--g-bg)!important;min-height:100vh!important}.app-grid{max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:1.15fr .85fr!important;gap:12px!important;align-items:start!important}.hero-panel,.info-panel,.participation-zone,.side-quests-panel,.tickets-panel,.message-wall-panel,.admin-panel,.consensus-strip,.data-lab-panel{background:var(--g-panel)!important;border:1px solid var(--g-line)!important;border-radius:0!important;box-shadow:0 1px 2px rgba(15,23,42,.04)!important;backdrop-filter:none!important;color:var(--g-text)!important;padding:14px!important;overflow:hidden!important}.hero-panel{grid-column:1/-1!important;min-height:118px!important;position:relative!important}.hero-panel:before{content:'Assistance / Tickets / Baby Bet Marine';display:block;margin:-14px -14px 12px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--g-line);color:#62748a;font-size:12px}.hero-panel:after{content:'Ticket waiting for your approval';position:absolute!important;right:14px!important;top:12px!important;font-size:12px!important;color:#64748b!important;background:#edf2f7!important;border:1px solid #d8e1ec!important;border-radius:2px!important;padding:4px 8px!important;font-weight:700!important;letter-spacing:0!important}.brand-pill{background:#edf2f7!important;border:1px solid #d8e1ec!important;color:#40566d!important;border-radius:2px!important;font-size:12px!important;padding:4px 8px!important;font-weight:800!important}.hero-panel h1{margin:8px 0 0!important;color:#1f2937!important;font-size:26px!important;line-height:1.12!important;letter-spacing:-.025em!important}.hero-copy{margin-top:6px!important;color:#667085!important;font-size:13px!important;max-width:780px!important}.hero-actions{margin-top:10px!important}.cta-primary,.participation-launch{background:#2f6fa3!important;color:#fff!important;border:1px solid #285f8b!important;border-radius:2px!important;box-shadow:none!important}.cta-secondary{background:#fff!important;color:#334e68!important;border:1px solid #cbd5e1!important;border-radius:2px!important}.cta-primary.huge{font-size:13px!important;padding:8px 11px!important}.cta-primary:hover,.cta-secondary:hover,.participation-launch:hover{transform:none!important;filter:brightness(.98)}

      .consensus-strip{grid-column:1/-1!important;display:grid!important;grid-template-columns:1.35fr repeat(5,1fr)!important;gap:8px!important;background:#fff!important}.strip-title{gap:8px!important}.strip-title>span,.panel-title>span{width:30px!important;height:30px!important;background:#eef3f8!important;color:#354f68!important;border:1px solid #d8e1ec!important;border-radius:2px!important;font-size:15px!important}.strip-title b,.panel-title h2{color:#1f2937!important;font-size:16px!important;letter-spacing:0!important;font-weight:800!important}.strip-title small,.panel-title p{color:#7a8796!important;font-size:12px!important}.panel-title{margin-bottom:10px!important}.metric{background:#f8fafc!important;border:1px solid #d8e1ec!important;border-radius:0!important;padding:8px!important}.metric span{color:#667085!important;font-size:10px!important;letter-spacing:.07em!important}.metric strong{color:#263238!important;font-size:16px!important}.metric small{display:block;color:#7a8796;font-size:11px;margin-top:3px}

      .info-panel{grid-column:1/2!important}.participation-zone{grid-column:2/3!important;display:grid!important;grid-template-columns:1fr!important;gap:10px!important}.info-cards{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.info-card{background:#fff!important;border:1px solid var(--g-line)!important;border-radius:0!important;padding:10px!important;min-height:98px!important}.info-card>span{font-size:22px!important}.info-card b{display:block;color:#273447!important;font-size:13px!important;margin-top:6px!important}.info-card p,.participation-copy p{font-size:12px!important;color:#667085!important;line-height:1.35!important}.participation-launch{min-height:56px!important;display:flex!important;justify-content:space-between!important;text-align:left!important;padding:10px 12px!important}.participation-launch b{font-size:18px!important}.participation-launch span{color:#dbeafe!important;font-size:12px!important}

      .side-quests-panel{grid-column:1/2!important}.message-wall-panel{grid-column:2/3!important}.quest-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.quest-card,.message-card{background:#fff!important;border:1px solid var(--g-line)!important;border-left:4px solid #8db1ca!important;border-radius:0!important;padding:8px 10px!important;min-height:72px!important}.quest-card:nth-child(2n){border-left-color:#f0b64d!important}.quest-card:nth-child(3n){border-left-color:#89b58f!important}.quest-card span{color:#667085!important;font-size:10px!important;letter-spacing:.06em!important}.quest-card b{color:#1f2937!important;font-size:15px!important;letter-spacing:0!important}.quest-card p,.message-card p{font-size:12px!important;color:#667085!important;line-height:1.28!important}.message-wall{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;max-height:330px!important;overflow:auto!important}.message-card b{color:#2f6fa3!important}.empty-state{background:#fff!important;border:1px dashed #cbd5e1!important;border-radius:0!important;color:#7a8796!important}

      .tickets-panel{grid-column:1/-1!important}.tickets-panel:before{content:'Showing 1 to 50 of baby bet entries';display:block;background:#fff;border:1px solid var(--g-line);border-bottom:0;padding:9px 12px;color:#667085;font-size:12px}.tickets-wall{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;border:1px solid var(--g-line)!important;border-top:0!important}.ticket{position:relative;background:#fff!important;border:0!important;border-bottom:1px solid #e6ebf1!important;border-right:1px solid #e6ebf1!important;border-radius:0!important;box-shadow:none!important;color:#263238!important;text-align:left!important;padding:12px 10px 11px 14px!important}.ticket:nth-child(8n+5),.ticket:nth-child(8n+6),.ticket:nth-child(8n+7),.ticket:nth-child(8n+8){background:#f6f8fb!important}.ticket:before{content:'New';position:absolute;right:8px;top:8px;background:#eaf7ef;border:1px solid #c6e7d0;color:#2f7d41;font-size:10px;font-weight:800;padding:3px 6px;border-radius:2px}.ticket-top span{width:26px!important;height:26px!important;border-radius:2px!important;background:#d9e8f4!important;color:#315b7e!important}.ticket-top b{font-size:14px!important;color:#2f5f90!important;padding-right:52px}.ticket-prediction{font-size:13px!important;color:#425466!important;margin-top:7px!important}.ticket-meta{gap:4px!important;margin-top:7px!important}.ticket-meta span{background:#f8fafc!important;color:#425466!important;border:1px solid #d8e1ec!important;border-radius:2px!important;padding:3px 5px!important;font-size:11px!important}.ticket-badges{border-top:1px solid #edf1f5!important}.ticket-badges span{background:#fff!important;color:#516174!important;border:1px solid #d8e1ec!important;box-shadow:none!important}.ticket-badges .auto-first-badge{background:#fff3cd!important;border-color:#ffd966!important;color:#6a5000!important}.ticket-badges .auto-last-badge{background:#e7f1ff!important;color:#245d91!important}

      .data-lab-panel{grid-column:1/-1!important;background:#fff!important}.data-lab-panel .panel-title:after{content:'Graphiques générés depuis la table public.bets';margin-left:auto;color:#7a8796;font-size:11px}.data-lab-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px!important}.chart-card{background:#fff!important;border:1px solid var(--g-line)!important;border-radius:0!important;box-shadow:none!important;min-height:185px!important;padding:10px!important}.chart-head b{color:#1f2937!important;font-size:14px!important}.chart-head span{color:#7a8796!important;font-size:11px!important}.donut:after{background:#fff!important}.donut b{color:#263238!important}.histo-row span,.date-bar b,.date-bar small,.legend-row,.scatter text{color:#425466!important;fill:#425466!important}.bar-track,.histo-row div{background:#e6edf3!important}.empty-mini{background:#fff!important;color:#7a8796!important;border-color:#cbd5e1!important;border-radius:0!important}

      .admin-panel{grid-column:1/-1!important;background:#fff!important;border-top:3px solid #d8e1ec!important}.admin-login{display:flex!important;gap:8px!important}.result-fields{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:8px!important}.admin-actions button,.admin-login button{background:#2f6fa3!important;color:#fff!important;border:1px solid #285f8b!important;border-radius:2px!important}.locked{background:#f8fafc!important;border:1px dashed #cbd5e1!important;border-radius:0!important;color:#667085!important}.podium-card{border-radius:0!important;background:#fff!important;border:1px solid var(--g-line)!important;color:#263238!important}.podium-card strong,.podium-card b{color:#263238!important}

      input,select,textarea{border:1px solid #cbd5e1!important;border-radius:2px!important;background:#fff!important;color:#263238!important;padding:8px 9px!important}.choice{border-radius:2px!important;background:#fff!important;color:#263238!important;border:1px solid #cbd5e1!important}.choice.active{background:#2f6fa3!important;color:#fff!important}.progress-steps button{border-radius:2px!important}.progress-steps button.active{background:#2f6fa3!important;color:#fff!important}.wizard-card,.modal-card,.participation-modal{border-radius:2px!important;background:#fff!important;color:#263238!important;border:1px solid #cbd5e1!important}.participation-backdrop,.modal-backdrop{background:rgba(30,41,59,.65)!important}.participation-aside{background:#f8fafc!important;border-right:1px solid #d8e1ec!important}.participation-aside h2,.modal-card h2{color:#1f2937!important}.participation-aside p,.modal-card p{color:#667085!important}.gift-card{background:#fff!important;border:1px solid var(--g-line)!important;border-radius:0!important}.modal-close{background:#eef3f8!important;color:#263238!important}.ticket-big-avatar{border-radius:2px!important;background:#2f6fa3!important;color:#fff!important}.danger{border-radius:2px!important;background:#dc5b5b!important}.toast{border-radius:2px!important;background:#1f2937!important;color:#fff!important}

      .glpi-status-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}.glpi-kpi{background:#fff;border:1px solid var(--g-line);border-left:4px solid #8db1ca;padding:9px}.glpi-kpi span{display:block;color:#667085;font-size:10px;text-transform:uppercase;font-weight:800}.glpi-kpi b{display:block;color:#1f2937;font-size:18px;margin-top:3px}.glpi-kpi:nth-child(2){border-left-color:#f0b64d}.glpi-kpi:nth-child(3){border-left-color:#89b58f}.glpi-kpi:nth-child(4){border-left-color:#b49bd7}.glpi-kpi:nth-child(5){border-left-color:#dc5b5b}

      @media(max-width:1050px){.glpi-sidebar{display:none}.glpi-topbar,.glpi-filterbar{left:0}.glpi-topbar{height:auto;min-height:50px;flex-wrap:wrap}.glpi-filterbar{position:relative;top:0;left:0;margin-top:50px}.app-shell{padding:12px!important}.app-grid{grid-template-columns:1fr!important}.info-panel,.participation-zone,.side-quests-panel,.message-wall-panel,.tickets-panel,.admin-panel,.data-lab-panel{grid-column:1/-1!important}.tickets-wall,.data-lab-grid{grid-template-columns:repeat(2,1fr)!important}.glpi-actions,.glpi-search{display:none}.glpi-status-row{grid-template-columns:repeat(2,1fr)}}
      @media(max-width:680px){.tickets-wall,.data-lab-grid,.quest-grid,.result-fields,.glpi-status-row{grid-template-columns:1fr!important}.glpi-user{display:none}.hero-panel h1{font-size:23px!important}.glpi-filterbar{display:none}.app-shell{padding-top:72px!important}}
    </style>
  </head>
  <body>
    <aside class="glpi-sidebar">
      <div class="glpi-logo">GLPI</div>
      <div class="glpi-goto">➜ Go to...</div>
      <div class="glpi-menu-section">▟ Assets <span>⌄</span></div>
      <a class="glpi-menu-item"><span class="ico">▦</span>Dashboard</a>
      <a class="glpi-menu-item"><span class="ico">▣</span>Computers</a>
      <a class="glpi-menu-item"><span class="ico">▤</span>Software</a>
      <div class="glpi-menu-section active">◔ Assistance <span>⌄</span></div>
      <a class="glpi-menu-item"><span class="ico">▦</span>Dashboard</a>
      <a class="glpi-menu-item active"><span class="ico">●</span>Tickets</a>
      <a class="glpi-menu-item"><span class="ico">＋</span>Create Ticket</a>
      <a class="glpi-menu-item"><span class="ico">▲</span>Problems</a>
      <a class="glpi-menu-item"><span class="ico">▣</span>Changes</a>
      <a class="glpi-menu-item"><span class="ico">▥</span>Planning</a>
      <a class="glpi-menu-item"><span class="ico">▥</span>Statistics</a>
      <div class="glpi-menu-section">▣ Management <span>⌄</span></div>
      <div class="glpi-menu-section">⚙ Setup <span>⌄</span></div>
      <div class="glpi-collapse">≪ Collapse menu</div>
    </aside>
    <header class="glpi-topbar">
      <div class="glpi-breadcrumb">⌂ Home <span>/</span> ◔ Assistance <span>/</span> <b>Tickets</b></div>
      <div class="glpi-actions"><button class="primary">＋ Add</button><button>⌕ Search</button><button>★ Lists</button><button>▤ Templates</button><button>▣ Global Kanban</button></div>
      <div class="glpi-search"><input placeholder="Search..."/><button>⌕</button></div>
      <div class="glpi-user"><div><b>super-admin</b><small>Root (tree structure)</small></div><div class="glpi-avatar">👤</div></div>
    </header>
    <section class="glpi-filterbar">
      <div class="glpi-filter-row"><button>⊟</button><select><option>-----</option></select><select><option>Characteristics - Status</option></select><select><option>is</option></select><select><option>Not Solved</option></select><input placeholder="" /></div>
      <div class="glpi-rules"><span>⊞ rule</span><span>⊞ global rule</span><span>⊞ group</span><span class="search">⌕ Search</span><span class="star">★</span><span class="star">↻</span></div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        function insertStatus(){
          const hero=document.querySelector('.hero-panel');
          if(!hero||document.querySelector('.glpi-status-row'))return;
          const tickets=document.querySelectorAll('.ticket').length;
          const messages=document.querySelectorAll('.message-card').length;
          const row=document.createElement('div');
          row.className='glpi-status-row';
          row.innerHTML='<div class="glpi-kpi"><span>Status</span><b>New</b></div><div class="glpi-kpi"><span>Priority</span><b>High</b></div><div class="glpi-kpi"><span>Tickets</span><b>'+tickets+'</b></div><div class="glpi-kpi"><span>Messages</span><b>'+messages+'</b></div><div class="glpi-kpi"><span>Due date</span><b>25/06</b></div>';
          hero.appendChild(row);
        }
        const t=setInterval(()=>{insertStatus(); if(document.querySelector('.tickets-panel')) clearInterval(t);},250);
        setInterval(()=>{const old=document.querySelector('.glpi-status-row'); if(old) old.remove(); insertStatus();},5000);
      })();
    </script>
  </body>
</html>
