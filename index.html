<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLPI Baby Bet Marine</title>
  </head>
  <body>
    <aside class="glpi-sidebar">
      <div class="glpi-logo">GLPI</div>
      <div class="glpi-goto">➜ Go to...</div>
      <div class="glpi-menu-section">▟ Assets <span>⌄</span></div>
      <a class="glpi-menu-item">▦ Dashboard</a>
      <a class="glpi-menu-item">▣ Computers</a>
      <a class="glpi-menu-item">▤ Software</a>
      <div class="glpi-menu-section active">◔ Assistance <span>⌄</span></div>
      <a class="glpi-menu-item active">● Tickets</a>
      <a class="glpi-menu-item">▲ Problems</a>
      <a class="glpi-menu-item">▣ Changes</a>
      <a class="glpi-menu-item">▥ Statistics</a>
      <div class="glpi-menu-section">▣ Management <span>⌄</span></div>
      <div class="glpi-menu-section">⚙ Setup <span>⌄</span></div>
      <div class="glpi-collapse">≪ Collapse menu</div>
    </aside>

    <header class="glpi-topbar">
      <div class="glpi-breadcrumb">⌂ Home <span>/</span> ◔ Assistance <span>/</span> <b>Baby Bet</b></div>
      <div class="glpi-actions"><button class="primary">＋ Add bet</button><button>⌕ Search</button></div>
      <div class="glpi-search"><input placeholder="Search..."/><button>⌕</button></div>
      <div class="glpi-user"><div><b>super-admin</b><small>Root (tree structure)</small></div><div class="glpi-avatar">👤</div></div>
    </header>

    <section class="glpi-filterbar">
      <div class="glpi-filter-row">
        <select><option>Assistance</option></select>
        <select><option>Tickets naissance</option></select>
        <select><option>is</option></select>
        <select><option>Not Solved</option></select>
        <input class="wide" placeholder="Baby Bet Marine"/>
        <button class="search">⌕ Search</button>
      </div>
    </section>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/glpi-dom-enhance.js"></script>
    <style id="final-density-fix">
      .side-quests-panel .quest-grid{gap:8px!important;padding:10px!important;align-items:start!important}
      .side-quests-panel .quest-card{min-height:0!important;height:auto!important;padding:8px 10px 8px 54px!important;border-radius:6px!important}
      .side-quests-panel .quest-card:before{left:10px!important;top:10px!important;width:30px!important;height:30px!important;border-radius:7px!important}
      .side-quests-panel .quest-card:after{left:17px!important;top:16px!important;font-size:15px!important}
      .side-quests-panel .quest-card span{font-size:9px!important;line-height:1!important;letter-spacing:.06em!important;margin:0!important}
      .side-quests-panel .quest-card b{font-size:15px!important;line-height:1.02!important;margin:3px 0 0!important}
      .side-quests-panel .quest-card p{font-size:11px!important;line-height:1.12!important;margin:4px 0 0!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
      .tickets-wall{align-items:start!important}
      .tickets-panel .ticket{min-height:0!important;height:auto!important;padding:9px 10px!important;display:block!important}
      .tickets-panel .ticket-top{margin:0!important}
      .tickets-panel .ticket-prediction{margin:6px 0 0!important;line-height:1.2!important}
      .tickets-panel .ticket-facts{margin:5px 0 0!important}
      .tickets-panel .ticket-note{margin:6px 0 0!important;padding:6px 8px!important;min-height:0!important}
      .tickets-panel .ticket-note span{line-height:1!important;margin:0!important}
      .tickets-panel .ticket-note p{margin:3px 0 0!important;line-height:1.15!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
      .tickets-panel .ticket-badges{margin:6px 0 0!important;padding-top:6px!important;gap:4px!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .tickets-panel .ticket-badges span{min-height:21px!important;padding:3px 5px!important;font-size:10px!important;line-height:1.05!important}
      .admin-panel > div:first-child{margin-bottom:10px!important}
      .admin-panel > div:first-child .panel-title{padding:9px 12px!important;min-height:0!important}
      .admin-panel > div:first-child .panel-title>span{width:28px!important;height:28px!important;font-size:14px!important}
      .admin-panel > div:first-child .panel-title h2{font-size:15px!important;line-height:1.05!important}
      .admin-panel > div:first-child .panel-title p{font-size:11px!important;margin-top:1px!important}
      .admin-panel > div:first-child .quest-grid{padding:10px!important;gap:8px!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;align-items:start!important}
      .admin-panel > div:first-child .quest-card{min-height:0!important;height:auto!important;padding:8px 10px!important;border-radius:6px!important;border-left-width:4px!important}
      .admin-panel > div:first-child .quest-card:before,.admin-panel > div:first-child .quest-card:after{display:none!important}
      .admin-panel > div:first-child .quest-card span{font-size:9px!important;line-height:1!important;margin:0!important}
      .admin-panel > div:first-child .quest-card b{font-size:15px!important;line-height:1.05!important;margin:3px 0 0!important}
      .admin-panel > div:first-child .quest-card p{font-size:11px!important;line-height:1.12!important;margin:4px 0 0!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
      .admin-panel > div:first-child .result-fields{margin:10px!important;gap:8px!important}
      .admin-panel > div:first-child .result-fields .metric{padding:8px!important;min-height:0!important}
      @media(max-width:1350px){.side-quests-panel .quest-card{padding-top:8px!important;padding-bottom:8px!important}.tickets-panel .ticket{padding:9px!important}.admin-panel > div:first-child .quest-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
      @media(max-width:680px){.admin-panel > div:first-child .quest-grid{grid-template-columns:1fr!important}}
    </style>
  </body>
</html>
