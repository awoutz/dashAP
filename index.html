    <script>
      (function(){
        const content = '📅 Pour information, le terme officiel est prévu le 25/06.';
        function addOfficialTermNote(){
          const copy = document.querySelector('.hero-copy');
          if (!copy || document.querySelector('.official-term-note')) return false;
          const note = document.createElement('p');
          note.className = 'official-term-note';
          note.textContent = content;
          copy.insertAdjacentElement('afterend', note);
          return true;
        }
        const timer = setInterval(function(){ if (addOfficialTermNote()) clearInterval(timer); }, 150);
        setTimeout(function(){ clearInterval(timer); addOfficialTermNote(); }, 5000);
      })();
    </script>
    <style id="final-density-fix">
      .official-term-note{display:inline-flex!important;align-items:center!important;width:max-content!important;max-width:100%!important;margin:6px 0 0!important;padding:5px 9px!important;border:1px solid #d7e0ea!important;border-left:4px solid #f5a623!important;border-radius:6px!important;background:#fff8e7!important;color:#24364a!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important}
      .quest-grid{gap:8px!important;align-items:start!important;grid-auto-rows:min-content!important}.side-quests-panel .quest-grid{padding:10px!important}.quest-card{height:auto!important;min-height:0!important;max-height:none!important;align-self:start!important;padding:8px 10px!important;border-radius:6px!important;overflow:hidden!important;display:block!important}.quest-card:before,.quest-card:after{display:none!important;content:none!important}.quest-card span{font-size:9px!important;line-height:1!important;letter-spacing:.06em!important;margin:0!important}.quest-card b{font-size:14px!important;line-height:1.05!important;margin:4px 0 0!important;display:-webkit-box!important;-webkit-line-clamp:1!important;-webkit-box-orient:vertical!important;overflow:hidden!important}.quest-card p{font-size:11px!important;line-height:1.15!important;margin:5px 0 0!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;color:#667085!important}
    </style>
