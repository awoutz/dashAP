<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLPI Baby Bet Marine</title>
    <style>
      .side-quests-panel .quest-grid{gap:8px!important;padding:10px!important}
      .quest-card{min-height:86px!important;padding:9px 10px 9px 56px!important;border-radius:6px!important}
      .quest-card:before{left:10px!important;top:12px!important;width:32px!important;height:32px!important;border-radius:7px!important}
      .quest-card:after{left:17px!important;top:18px!important;font-size:16px!important}
      .quest-card span{font-size:9px!important;line-height:1!important;letter-spacing:.06em!important}
      .quest-card b{font-size:15px!important;line-height:1.05!important;margin-top:3px!important}
      .quest-card p{font-size:11px!important;line-height:1.18!important;margin-top:4px!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
      .tickets-wall{align-items:stretch!important}
      .ticket{min-height:168px!important;padding:10px!important}
      .ticket-prediction{margin-top:6px!important;line-height:1.25!important}
      .ticket-facts{margin-top:5px!important}
      .ticket-note{margin-top:7px!important;padding:7px 8px!important;min-height:0!important}
      .ticket-note span{line-height:1!important;margin:0!important}
      .ticket-note p{margin:3px 0 0!important;line-height:1.18!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
      .ticket-badges{margin-top:7px!important;gap:4px!important}
      .ticket-badges span{min-height:22px!important;padding:3px 5px!important;font-size:10px!important;line-height:1.1!important}
      @media (max-width:1350px){.quest-card{min-height:82px!important}.ticket{min-height:160px!important}}
    </style>
  </head>
  <body>
    <aside class="glpi-sidebar">
      <div class="glpi-logo">GLPI</div>
      <div class="glpi-goto">➜ Go to...</div>
      <div class="glpi-menu-section">▟ Assets <span>⌄</span></div>
      <a class="glpi-menu-item">▦ Dashboard</a>
      <a class="glpi-menu-item">▣ Computers</a>
      <a class="glpi-menu-item">▤ Software</a>
      <div class="glpi-menu-section active">◔ Assistance <span>⌄</span></div>
      <a class="glpi-menu-item active">● Tickets</a>
      <a class="glpi-menu-item">▲ Problems</a>
      <a class="glpi-menu-item">▣ Changes</a>
      <a class="glpi-menu-item">▥ Statistics</a>
      <div class="glpi-menu-section">▣ Management <span>⌄</span></div>
      <div class="glpi-menu-section">⚙ Setup <span>⌄</span></div>
      <div class="glpi-collapse">≪ Collapse menu</div>
    </aside>

    <header class="glpi-topbar">
      <div class="glpi-breadcrumb">⌂ Home <span>/</span> ◔ Assistance <span>/</span> <b>Baby Bet</b></div>
      <div class="glpi-actions"><button class="primary">＋ Add bet</button><button>⌕ Search</button></div>
      <div class="glpi-search"><input placeholder="Search..."/><button>⌕</button></div>
      <div class="glpi-user"><div><b>super-admin</b><small>Root (tree structure)</small></div><div class="glpi-avatar">👤</div></div>
    </header>

    <section class="glpi-filterbar">
      <div class="glpi-filter-row">
        <select><option>Assistance</option></select>
        <select><option>Tickets naissance</option></select>
        <select><option>is</option></select>
        <select><option>Not Solved</option></select>
        <input class="wide" placeholder="Baby Bet Marine"/>
        <button class="search">⌕ Search</button>
      </div>
    </section>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/glpi-dom-enhance.js"></script>
  </body>
</html>
